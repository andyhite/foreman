id = "andyhite.foreman"
name = "Foreman"
version = "0.7.3"
min_herdr_version = "0.8.0"
description = "Dispatch peer coding agents into herdr worktree workspaces."
platforms = ["linux", "macos"]

# Installing the plugin puts foreman on PATH: agents invoke the CLI from ordinary
# shells, and herdr has no mechanism for a plugin to export a binary.
[[startup]]
command = ["sh", "bin/foreman-link", "--quiet"]

# Plugin actions take no arguments, so the two exposed here are the two that
# need none. Both go through a wrapper rather than calling `bin/foreman` directly:
# actions run with cwd set to the plugin root, and foreman scopes its inventory to
# the repo it runs in, so an unwrapped call would always report on this plugin's
# own checkout.
[[actions]]
id = "ls"
title = "List foreman workers"
contexts = ["workspace"]
command = ["./bin/foreman-ls"]

# The dashboard is the interactive half of `ls`, and the one worth binding a key
# to. It needs an action to reach it: the palette and `[[keys.command]]` both
# address actions, never pane entrypoints.
[[actions]]
id = "dashboard"
title = "Foreman dashboard"
description = "Inspect and operate this workspace's foreman in a popup."
contexts = ["workspace"]
command = ["./bin/foreman-dashboard-open"]

# A popup rather than a split or a tab: the dashboard is something you open, act
# in, and dismiss, and a popup leaves the tiled layout — including the agent
# panes it reports on — exactly as it found it. Unlike an action, a pane
# entrypoint receives its own $HERDR_PLUGIN_CONTEXT_JSON, so the dashboard reads
# the workspace it belongs to without being told.
[[panes]]
id = "dashboard"
title = "Foreman"
placement = "popup"
width = "85%"
height = "80%"
command = ["bash", "bin/foreman-dashboard"]
