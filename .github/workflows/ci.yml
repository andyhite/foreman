name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Type-check the extension
        run: bunx tsc --noEmit
      - name: Run the extension test suite
        run: bun test
      - name: Check version consistency
        run: |
          plugin_json_version=$(jq -r '.version' .omp-plugin/plugin.json)
          package_json_version=$(jq -r '.version' package.json)

          if [ "$plugin_json_version" != "$package_json_version" ]; then
            echo "Version mismatch:"
            echo ".omp-plugin/plugin.json: $plugin_json_version"
            echo "package.json: $package_json_version"
            exit 1
          fi
