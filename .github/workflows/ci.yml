name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Type-check the extension
        run: bunx tsc --noEmit
      - name: Run the extension test suite
        run: bun test
      - name: Check version consistency
        run: |
          plugin_json_version=$(jq -r '.version' .omp-plugin/plugin.json)
          package_json_version=$(jq -r '.version' package.json)

          if [ "$plugin_json_version" != "$package_json_version" ]; then
            echo "Version mismatch:"
            echo ".omp-plugin/plugin.json: $plugin_json_version"
            echo "package.json: $package_json_version"
            exit 1
          fi

  tag-release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag release if package.json version is new
        run: |
          version=$(jq -r '.version' package.json)
          tag="v$version"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
