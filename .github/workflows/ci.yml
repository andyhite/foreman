name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fleet test suite
        run: /bin/bash herdr/test/fleet-test.sh
      - name: Run fleet-link test suite
        run: /bin/bash herdr/test/fleet-link-test.sh
      - name: Run fleet dashboard test suite
        run: /bin/bash herdr/test/fleet-dashboard-test.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bash syntax and run tests with modern bash
        run: |
          bash -n herdr/bin/fleet
          bash -n herdr/bin/fleet-dashboard
          bash herdr/test/fleet-test.sh
          bash herdr/test/fleet-dashboard-test.sh
      - name: Lint bash scripts
        run: shellcheck --severity=warning -s bash herdr/bin/fleet herdr/bin/fleet-dashboard herdr/test/fleet-test.sh herdr/test/fleet-link-test.sh herdr/test/fleet-dashboard-test.sh
      - name: Lint POSIX shell scripts
        run: shellcheck --severity=warning -s sh herdr/bin/fleet-link herdr/bin/fleet-ls herdr/bin/fleet-dashboard-open herdr/install.sh
      - name: Check version consistency
        run: |
          herdr_version=$(awk -F'"' '/^version = / {print $2; exit}' herdr/herdr-plugin.toml)
          plugin_json_version=$(jq -r '.version' plugins/fleet/.omp-plugin/plugin.json)
          marketplace_version=$(jq -r '.plugins[0].version' .omp-plugin/marketplace.json)
          package_json_version=$(jq -r '.version' plugins/fleet/package.json)

          # Collect all versions
          versions=("$herdr_version" "$plugin_json_version" "$marketplace_version" "$package_json_version")

          # Check all versions are identical
          first="${versions[0]}"
          all_same=true
          for v in "${versions[@]}"; do
            if [ "$v" != "$first" ]; then
              all_same=false
              break
            fi
          done

          if [ "$all_same" = false ]; then
            echo "Version mismatch:"
            echo "herdr/herdr-plugin.toml: $herdr_version"
            echo "plugins/fleet/.omp-plugin/plugin.json: $plugin_json_version"
            echo ".omp-plugin/marketplace.json: $marketplace_version"
            echo "plugins/fleet/package.json: $package_json_version"
            exit 1
          fi
