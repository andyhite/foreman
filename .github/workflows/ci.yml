name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Build every package
        run: bun run build

      - name: Exercise the built CLI
        run: bun packages/cli/dist/main.js --help

      - name: Lint the installer script
        run: bash -n scripts/install.sh

      # The four agent definitions carry their output schema inlined in
      # frontmatter, generated from the TypeBox definitions in packages/core.
      # A hand-edit there would silently diverge from the validator the
      # extension applies, so regeneration must be a no-op on a clean tree.
      - name: Schemas and agent frontmatter are in sync
        run: |
          bun run schemas
          if ! git diff --quiet; then
            echo "::error::Generated schemas are stale. Run 'bun run schemas' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

  agent-contract:
    name: agent definition contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # These are the invariants that cost a whole build cycle to discover the
      # hard way (see docs/VERIFIED.md): a tool name omp does not have is dropped
      # in silence, an unknown skill name in autoloadSkills is dropped in
      # silence, and `spawns` or `task` would hand a workflow agent the fan-out
      # Foreman exists to prevent.
      - name: Check agent and skill wiring
        run: bun run contract
