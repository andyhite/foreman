# Foreman board — herdr plugin manifest (SPEC §17.4).
#
# Bind the blocked drain to a key in ~/.config/herdr/config.toml, e.g.:
#
#   [[keys.command]]
#   key = "ctrl+shift+b"
#   type = "plugin_action"
#   command = "andyhite.foreman.open-blocked"
#   description = "Foreman: open the blocked drain"

id = "andyhite.foreman"
name = "Foreman board"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Blocked drain, proposal review, board, and agent detail for Foreman (SPEC §17.4)"
platforms = ["linux", "macos"]

[[build]]
command = ["bun", "run", "build"]

# One-shot: ensures one foreman-loop pane per registry repo (each in that
# repo's own workspace) plus the shared foreman-intake pane in the `foreman`
# workspace. Re-runs on live handoff, so startup.ts guards double-start per
# alias via HERDR_PLUGIN_STATE_DIR (SPEC §3.11, §17.3, §17.4 — "[[startup]]
# starts the loop pane; it does not be the loop").
[[startup]]
command = ["bun", "run", "dist/startup.js"]

[[panes]]
id = "blocked"
title = "Foreman: Blocked drain"
placement = "popup"
width = "85%"
height = "80%"
command = ["bun", "run", "dist/board.js", "blocked"]

[[panes]]
id = "proposals"
title = "Foreman: Proposals"
placement = "popup"
width = "85%"
height = "80%"
command = ["bun", "run", "dist/board.js", "proposals"]

[[panes]]
id = "board"
title = "Foreman: Board"
placement = "tab"
command = ["bun", "run", "dist/board.js", "board"]

[[panes]]
id = "agents"
title = "Foreman: Agents"
# No width/height: herdr accepts an explicit pane size only for `popup`.
placement = "overlay"
command = ["bun", "run", "dist/board.js", "agents"]

# Every action shells `bin/open-pane`: actions are the only thing the palette
# and `[[keys.command]]` can address, and they take no arguments, so the
# entrypoint id is baked into each argv.
[[actions]]
id = "open-blocked"
title = "Foreman: Answer blocked questions"
description = "List every BlockRecord and resolve one with a keypress (SPEC §9, §17.4)"
contexts = ["global"]
command = ["sh", "bin/open-pane", "blocked"]

[[actions]]
id = "open-proposals"
title = "Foreman: Approve or reject proposals"
description = "Triage batch, per-item accept/reject"
contexts = ["global"]
command = ["sh", "bin/open-pane", "proposals"]

[[actions]]
id = "open-board"
title = "Foreman: Board overview"
description = "Issues by state, WIP, backpressure, last run per worker"
contexts = ["global"]
command = ["sh", "bin/open-pane", "board"]

[[actions]]
id = "open-agents"
title = "Foreman: Monitor live agents"
description = "Live agent status, jump-to-pane / attach"
contexts = ["global"]
command = ["sh", "bin/open-pane", "agents"]

# Refresh sidebar tokens on agent state change (SPEC §17.4 "Events").
#
# Verified against herdr 0.8.2: the event namespace is `pane.*`, not `agent.*`,
# and there is no blocked-specific event — `pane.agent_status_changed` fires on
# every transition, including into `blocked`. A herdr `blocked` means a Foreman
# bug (SPEC §17.3), not a normal queue entry, so events.ts separates that case
# from a routine status refresh and reports it loudly rather than routing on it.
[[events]]
on = "pane.agent_status_changed"
command = ["bun", "run", "dist/events.js"]
